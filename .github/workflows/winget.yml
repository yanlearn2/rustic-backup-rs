name: Publish to WinGet

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''
          $asset = "${{ github.event.release.assets[0].browser_download_url }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "asset=$asset" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
          echo "Asset: $asset"

      - name: Download installer and compute hash
        id: hash
        shell: pwsh
        run: |
          $asset = "${{ steps.release.outputs.asset }}"
          Invoke-WebRequest -Uri $asset -OutFile "RusticBackup-Setup.exe" -UseBasicParsing
          $sha256 = (Get-FileHash "RusticBackup-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$sha256" >> $env:GITHUB_OUTPUT
          echo "SHA256: $sha256"

      - name: Generate manifests (multi-file format)
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $asset = "${{ steps.release.outputs.asset }}"
          $sha256 = "${{ steps.hash.outputs.sha256 }}"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false

          # 先创建目录
          New-Item -ItemType Directory -Path "manifest" -Force | Out-Null

          # 1. Version manifest
          $versionManifest = @'
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json
          PackageIdentifier: yanlearn2.rustic-backup
          PackageVersion: {0}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          '@ -f $version
          $versionManifest = $versionManifest -replace "(?m)^          ", ""
          [System.IO.File]::WriteAllText("manifest\yanlearn2.rustic-backup.yaml", $versionManifest, $utf8NoBom)

          # 2. Locale manifest
          $localeManifest = @'
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
          PackageIdentifier: yanlearn2.rustic-backup
          PackageVersion: {0}
          PackageLocale: en-US
          Publisher: yanlearn2
          PublisherUrl: https://github.com/yanlearn2
          PackageName: Rustic Backup
          PackageUrl: https://github.com/yanlearn2/rustic-backup-rs
          License: MIT
          LicenseUrl: https://github.com/yanlearn2/rustic-backup-rs/blob/main/LICENSE
          ShortDescription: Incremental backup tool based on rustic with WeCom notification
          Tags:
            - backup
            - rustic
            - incremental
            - wecom
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          '@ -f $version
          $localeManifest = $localeManifest -replace "(?m)^          ", ""
          [System.IO.File]::WriteAllText("manifest\yanlearn2.rustic-backup.locale.en-US.yaml", $localeManifest, $utf8NoBom)

          # 3. Installer manifest
          $installerManifest = @'
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
          PackageIdentifier: yanlearn2.rustic-backup
          PackageVersion: {0}
          InstallerLocale: en-US
          InstallerType: inno
          InstallModes:
            - interactive
            - silent
            - silentWithProgress
          Installers:
            - Architecture: x64
              InstallerUrl: {1}
              InstallerSha256: {2}
          ManifestType: installer
          ManifestVersion: 1.12.0
          '@ -f $version, $asset, $sha256
          $installerManifest = $installerManifest -replace "(?m)^          ", ""
          [System.IO.File]::WriteAllText("manifest\yanlearn2.rustic-backup.installer.yaml", $installerManifest, $utf8NoBom)

          echo "=== Generated manifests ==="
          Get-ChildItem -Recurse manifest | ForEach-Object { $_.FullName }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile "wingetcreate.exe" -UseBasicParsing

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --no-open "manifest"
